name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssmdconvert
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: |
          rm -rf dist
          python -m build
      - name: Check built distributions
        run: python -m twine check dist/*
      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_release_artifacts.py
      - name: Install and smoke-test the built wheel
        run: |
          smoke_env="$RUNNER_TEMP/ssmdconvert-wheel-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --upgrade pip
          "$smoke_env/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/python" -c "import ssmdconvert; print(ssmdconvert.__version__)"
          "$smoke_env/bin/ssmdconvert" --version
          "$smoke_env/bin/ssmdconvert" --help
          "$smoke_env/bin/python" "$GITHUB_WORKSPACE/tools/smoke_installed.py"
          "$smoke_env/bin/python" -m pip check
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
