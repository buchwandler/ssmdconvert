name: Run tests
on:
  push:
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        install-mode: [core, all]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install core package and test dependencies
        if: matrix.install-mode == 'core'
        run: python -m pip install -e ".[dev]"
      - name: Install package with optional extras and test dependencies
        if: matrix.install-mode == 'all'
        run: python -m pip install -e ".[all,dev]"
      - name: Compile
        run: python -m compileall -q ssmdconvert tests
      - name: Test
        run: python -m pytest -m "not slow"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and type-check dependencies
        run: python -m pip install -e ".[dev]"
      - name: Type-check public API
        run: python -m mypy --config-file tests/typecheck/mypy.ini tests/typecheck/public_api.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html


  base-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install the base package
        run: python -m pip install .
      - name: Import package
        run: python -c "import ssmdconvert"
      - name: Smoke-test CLI
        run: ssmdconvert --help
      - name: Check installed version command
        run: ssmdconvert --version

  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [pdf, docx, jev]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install published extra
        run: python -m pip install -e ".[${{ matrix.extra }}]"
