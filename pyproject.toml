[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmdconvert"
dynamic = ["version"]
description = "Deterministically convert documents and books into SSMD."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Holger Nahrstaedt" }]
keywords = ["ssmd", "tts", "audiobook", "conversion", "epub", "markdown", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "ssmd>=0.9.2,<0.10",
  "epub2text>=0.2.8,<0.3",
  "typer>=0.20,<1",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
speech = ["spokenform>=0.4.3,<0.5"]
pdf = ["pypdf>=5,<7"]
docx = ["python-docx>=1.1,<2"]
all = [
  "spokenform>=0.4.3,<0.5",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "click>=8,<9",
  "ruff>=0.16,<1",
  "mypy>=1,<3",
  "build>=1,<2",
  "twine>=6,<7",
  "ebooklib>=0.18",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.scripts]
ssmdconvert = "ssmdconvert.cli:app"

[project.urls]
Homepage = "https://github.com/buchwandler/ssmdconvert"
Repository = "https://github.com/buchwandler/ssmdconvert"
Issues = "https://github.com/buchwandler/ssmdconvert/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ssmdconvert*"]

[tool.setuptools.package-data]
ssmdconvert = ["py.typed"]

[tool.setuptools_scm]
version_file = "ssmdconvert/_version.py"
fallback_version = "0+unknown"
parentdir_prefix_version = "ssmdconvert-"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
